{% extends 'admin/admin_base.html' %}
{% block title %}Assign Course to Student | WUB Portal{% endblock %}

{% block admin_content %}

<div class="container mt-4">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow-sm">

                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">📚 Assign Course to Student</h5>
                </div>

                <div class="card-body">

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Select Student</label>
                            <select name="student" class="form-control" required>
                                <option value="">-- Choose Student --</option>
                                {% for s in students %}
                                    <option value="{{ s.id }}">
                                        {{ s.username }} ({{ s.email }})
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Select Course</label>
                            <select name="course" class="form-control" required>
                                <option value="">-- Choose Course --</option>
                                {% for c in courses %}
                                    <option value="{{ c.id }}">
                                        {{ c.course_code }} - {{ c.course_title }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Semester</label>
                            <input type="number"
                                   name="semester"
                                   class="form-control"
                                   min="1"
                                   max="12"
                                   value="1"
                                   required>
                        </div>

                        <div class="d-flex justify-content-end gap-2">

                            <a href="{% url 'admin_courses' %}" class="btn btn-outline-secondary">
                                Cancel
                            </a>

                            <button type="submit" class="btn btn-primary">
                                Assign Course
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
