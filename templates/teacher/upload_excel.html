{% extends 'teacher/teacher_base.html' %}

{% block title %}
Excel Upload | WUB Portal
{% endblock %}

{% block teacher_content %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-bar-chart-fill me-2" viewBox="0 0 16 16"><path d="M1 11a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1zm5-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1zm5-5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1z"/></svg>Upload Marks From Excel
    </h3>
    <a href="{% url 'teacher_dashboard' %}" class="btn btn-secondary">
        ← Back Dashboard
    </a>
</div>

<div class="card shadow">
    <div class="card-header bg-primary text-white">
        Excel Upload
    </div>

    <div class="card-body">

        <a href="{% url 'download_excel_template' %}" class="btn btn-success mb-3">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-download me-1" viewBox="0 0 16 16"><path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5"/><path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708z"/></svg>Download Template
        </a>

        <form method="POST" enctype="multipart/form-data" id="uploadForm">
            {% csrf_token %}

            <!-- Semester Selection -->
            <div class="mb-3">
                <label class="form-label">Semester</label>
                <select name="semester" id="semesterSelect" class="form-control" required>
                    <option value="">-- Select Semester --</option>
                    <option value="1" {% if selected_semester == "1" %}selected{% endif %}>Semester 1</option>
                    <option value="2" {% if selected_semester == "2" %}selected{% endif %}>Semester 2</option>
                    <option value="3" {% if selected_semester == "3" %}selected{% endif %}>Semester 3</option>
                    <option value="4" {% if selected_semester == "4" %}selected{% endif %}>Semester 4</option>
                    <option value="5" {% if selected_semester == "5" %}selected{% endif %}>Semester 5</option>
                    <option value="6" {% if selected_semester == "6" %}selected{% endif %}>Semester 6</option>
                    <option value="7" {% if selected_semester == "7" %}selected{% endif %}>Semester 7</option>
                    <option value="8" {% if selected_semester == "8" %}selected{% endif %}>Semester 8</option>
                    <!-- Add more semesters if needed -->
                </select>
            </div>

            <!-- Course Selection (will be filtered by semester) -->
            <div class="mb-3">
                <label class="form-label">Course</label>
                <select name="course" id="courseSelect" class="form-control" required>
                    <option value="">-- Select Semester First --</option>
                    {% for c in courses %}
                    <option value="{{ c.id }}" data-semester="{{ c.semester }}">
                        {{ c.course_code }} - {{ c.course_title }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Excel File -->
            <div class="mb-3">
                <label class="form-label">Excel File</label>
                <input type="file" name="excel_file" class="form-control" accept=".xlsx" required>
            </div>

            <button type="submit" class="btn btn-primary">
                Upload Marks
            </button>
        </form>

    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const semesterSelect = document.getElementById('semesterSelect');
    const courseSelect = document.getElementById('courseSelect');

    function filterCourses() {
        const selectedSemester = semesterSelect.value;
        
        // Reset course select
        courseSelect.innerHTML = '<option value="">-- Select Course --</option>';

        if (!selectedSemester) return;

        const allOptions = document.querySelectorAll('#courseSelect option[data-semester]');
        
        allOptions.forEach(option => {
            if (option.getAttribute('data-semester') === selectedSemester) {
                courseSelect.appendChild(option.cloneNode(true));
            }
        });
    }

    // Filter courses when semester changes
    semesterSelect.addEventListener('change', filterCourses);

    // Initial filter if semester is already selected
    if (semesterSelect.value) {
        filterCourses();
    }
});
</script>
{% endblock %}
