{% extends 'home.html' %}
{% block content %}
<h2>Allowed Users</h2>
<a href="{% url 'allowed_add' %}">Add Allowed User</a>
<table>
    <tr><th>Name</th><th>Email</th><th>Role</th><th>Actions</th></tr>
    {% for it in items %}
    <tr>
        <td>{{ it.name }}</td>
        <td>{{ it.email }}</td>
        <td>{{ it.role }}</td>
        <td>
            <a href="{% url 'allowed_edit' it.pk %}">Edit</a>
            <form method="post" action="{% url 'allowed_delete' it.pk %}" style="display:inline;" class="delete-form">
                {% csrf_token %}
                <button type="submit" class="delete-btn">Delete</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
document.querySelectorAll('.delete-form').forEach(function(form){
    form.addEventListener('submit', function(e){
        e.preventDefault();
        Swal.fire({
            title: 'Are you sure?',
            text: "This will delete the allowed user.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#3085d6',
            cancelButtonColor: '#d33',
            confirmButtonText: 'Yes, delete it!'
        }).then((result) => {
            if (result.isConfirmed) {
                form.submit();
            }
        })
    })
})
</script>
{% endblock %}
